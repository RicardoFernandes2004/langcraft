plugins {
	id 'fabric-loom'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	mods {
		"langcraft" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Opcional: é o Mod Menu que mostra a engrenagem da tela de configuração.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Reconhecimento de voz offline. O JNA fica de fora porque o Minecraft ja traz o dele.
	implementation("com.alphacephei:vosk:${project.vosk_version}") { transitive = false }
	include("com.alphacephei:vosk:${project.vosk_version}") { transitive = false }

	// Reconhecimento mais resistente a ruido, usado no coreano.
	implementation "io.github.givimad:whisper-jni:${project.whisper_jni_version}"
	include "io.github.givimad:whisper-jni:${project.whisper_jni_version}"

	// Leitura em katakana para comparar respostas em japones.
	implementation "com.atilika.kuromoji:kuromoji-ipadic:${project.kuromoji_version}"
	include "com.atilika.kuromoji:kuromoji-ipadic:${project.kuromoji_version}"
	include "com.atilika.kuromoji:kuromoji-core:${project.kuromoji_version}"
}
