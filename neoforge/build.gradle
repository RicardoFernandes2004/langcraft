plugins {
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		langcraft {
			sourceSet sourceSets.main
		}
	}
}

// Cada biblioteca vai dentro do .jar do mod e também fica disponível nas execuções de desenvolvimento.
def bundled = [
	"com.alphacephei:vosk:${vosk_version}",
	"io.github.givimad:whisper-jni:${whisper_jni_version}",
	"com.atilika.kuromoji:kuromoji-ipadic:${kuromoji_version}",
	"com.atilika.kuromoji:kuromoji-core:${kuromoji_version}"
]

dependencies {
	bundled.each { notation ->
		def parts = notation.split(':')
		implementation(notation) { transitive = false }
		jarJar("${parts[0]}:${parts[1]}") {
			transitive = false
			version {
				strictly "[${parts[2]},)"
				prefer parts[2]
			}
		}
	}
}
