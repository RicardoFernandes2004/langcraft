plugins {
	id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
	id 'net.minecraftforge.renamer' version '1.0.14'
	id 'net.minecraftforge.jarjar' version '0.2.3'
}

minecraft {
	mappings channel: 'official', version: minecraft_version

	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
		}

		register('client')

		register('server') {
			args '--nogui'
		}

		register('data') {
			args '--mod', 'langcraft', '--all', '--output', layout.buildDirectory.dir('datagen').get().asFile
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
}

jarJar.register()

tasks.named('jar') {
	archiveClassifier = 'slim'
}

tasks.named('jarJar') {
	archiveClassifier = 'mojmap'
}

// O Forge 1.20.1 roda com outros nomes internos. O arquivo final é o jarJar com os nomes já trocados.
renamer.classes(tasks.named('jarJar', Jar))

def releaseJar = tasks.register('releaseJar', Copy) {
	from tasks.named('renameJarJar')
	into layout.buildDirectory.dir('release')
	rename { "${base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble') {
	dependsOn releaseJar
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

	[
		"com.alphacephei:vosk:${vosk_version}",
		"io.github.givimad:whisper-jni:${whisper_jni_version}",
		"com.atilika.kuromoji:kuromoji-ipadic:${kuromoji_version}",
		"com.atilika.kuromoji:kuromoji-core:${kuromoji_version}"
	].each { notation ->
		implementation(notation) { transitive = false }
		jarJar(notation) { transitive = false }
	}
}
renamer.mappings(minecraft.dependency.toSrg)
