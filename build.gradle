plugins {
	id 'fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
	group = rootProject.group
	version = rootProject.version

	apply plugin: 'java'

	base {
		archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
	}

	repositories {
		mavenCentral()
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = 'UTF-8'
	}

	// Cada loader compila o código de common junto com o seu, contra o próprio Minecraft dele.
	if (project.name != 'common') {
		tasks.named('jar') {
			from(rootProject.files('LICENSE', 'THIRD-PARTY-NOTICES.md'))
		}

		sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
		sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

		tasks.named('processResources') {
			def props = [version: project.version]
			inputs.properties(props)
			filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
				expand props
			}
		}
	}
}
