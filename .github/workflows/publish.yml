# Publica no Modrinth, no CurseForge e na própria release do GitHub quando uma release é publicada.
# A tag (como v1.0.2) aponta para a 1.21.11. A 1.20.1 vem da ponta da branch mc/1.20.1, que precisa estar na mesma versão.
# Passo a passo dos tokens e dos ids em docs/deploy/CHECKLIST.md.
name: Publicar

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de uma release que já existe, como v1.0.2
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Gerar ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mc: '1.21.11'
            ref: ''
            tasks: build
            forge_dir: forge/build/libs
            files: 3
          - mc: '1.20.1'
            ref: mc/1.20.1
            tasks: build :forge:releaseJar
            # Em forge/build/libs fica o arquivo antes da troca de nomes, que não abre no jogo.
            forge_dir: forge/build/release
            files: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || env.TAG }}

      - name: Conferir a versão
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::A versão em gradle.properties ($version) não bate com a tag $TAG."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # O Gradle roda no 21, e o ForgeGradle 7 usa o 25 para preparar o Minecraft.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar os arquivos
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.tasks }} --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_21_X64

      - name: Separar os arquivos
        run: |
          mkdir dist
          for file in fabric/build/libs/langcraft-fabric-${{ matrix.mc }}-$VERSION.jar \
              neoforge/build/libs/langcraft-neoforge-${{ matrix.mc }}-$VERSION.jar \
              ${{ matrix.forge_dir }}/langcraft-forge-${{ matrix.mc }}-$VERSION.jar; do
            if [ -f "$file" ]; then cp "$file" dist/; fi
          done
          ls -l dist
          if [ "$(ls dist | wc -l)" != "${{ matrix.files }}" ]; then
            echo "::error::Esperava ${{ matrix.files }} arquivos."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: dist/*.jar
          retention-days: 7

  # Só publica depois que as duas versões foram geradas, para nunca sair uma release pela metade.
  publish:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: dist
          merge-multiple: true

      - name: Ler a versão e as novidades
        id: info
        run: |
          version=${TAG#v}
          changelog=$(awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md | sed -e '/./,$!d')
          if [ -z "$changelog" ]; then
            echo "::error::CHANGELOG.md não tem a seção ## $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_END"
            echo "$changelog"
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: Fabric 1.21.11
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          files: dist/langcraft-fabric-1.21.11-${{ steps.info.outputs.version }}.jar
          name: LangCraft ${{ steps.info.outputs.version }} (Fabric 1.21.11)
          version: ${{ steps.info.outputs.version }}+fabric-1.21.11
          version-type: release
          changelog: ${{ steps.info.outputs.changelog }}
          loaders: fabric
          game-versions: '1.21.11'
          game-version-filter: none
          java: '21'
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}

      - name: NeoForge 1.21.11
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          files: dist/langcraft-neoforge-1.21.11-${{ steps.info.outputs.version }}.jar
          name: LangCraft ${{ steps.info.outputs.version }} (NeoForge 1.21.11)
          version: ${{ steps.info.outputs.version }}+neoforge-1.21.11
          version-type: release
          changelog: ${{ steps.info.outputs.changelog }}
          loaders: neoforge
          game-versions: '1.21.11'
          game-version-filter: none
          java: '21'

      - name: Forge 1.21.11
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          files: dist/langcraft-forge-1.21.11-${{ steps.info.outputs.version }}.jar
          name: LangCraft ${{ steps.info.outputs.version }} (Forge 1.21.11)
          version: ${{ steps.info.outputs.version }}+forge-1.21.11
          version-type: release
          changelog: ${{ steps.info.outputs.changelog }}
          loaders: forge
          game-versions: '1.21.11'
          game-version-filter: none
          java: '21'

      - name: Fabric 1.20.1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          files: dist/langcraft-fabric-1.20.1-${{ steps.info.outputs.version }}.jar
          name: LangCraft ${{ steps.info.outputs.version }} (Fabric 1.20.1)
          version: ${{ steps.info.outputs.version }}+fabric-1.20.1
          version-type: release
          changelog: ${{ steps.info.outputs.changelog }}
          loaders: fabric
          game-versions: '1.20.1'
          game-version-filter: none
          java: '17'
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}

      - name: Forge 1.20.1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          files: dist/langcraft-forge-1.20.1-${{ steps.info.outputs.version }}.jar
          name: LangCraft ${{ steps.info.outputs.version }} (Forge 1.20.1)
          version: ${{ steps.info.outputs.version }}+forge-1.20.1
          version-type: release
          changelog: ${{ steps.info.outputs.changelog }}
          loaders: forge
          game-versions: '1.20.1'
          game-version-filter: none
          java: '17'
